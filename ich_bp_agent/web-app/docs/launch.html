<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICH 血壓管理 - 啟動</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .loading {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h2>正在連接 FHIR 伺服器...</h2>
        <p>請稍候，正在進行授權認證</p>
    </div>

    <script>
        // SMART on FHIR OAuth2 Authorization
        FHIR.oauth2.authorize({
            // Client ID - 在衛服部 SMART Sandbox 註冊後取得
            // 測試時可使用 SMART Health IT 公開沙盒
            clientId: "ich_bp_app",

            // 請求的權限範圍
            scope: "launch openid fhirUser patient/Patient.read patient/Observation.read patient/Observation.write patient/Condition.read patient/MedicationRequest.read",

            // 授權完成後重定向到主頁面
            redirectUri: "index.html"
        });
    </script>
</body>
</html>
